<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slavadirta</title>
    <!-- Favicon menggunakan logo utama -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/slavadirta/slavadirta/refs/heads/main/file_00000000b39082078ccce663b9d3e18a.png">
    
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        surface: '#FFFFFF',
                        subtle: '#FAFAFA',
                        borderLight: '#E5E7EB',
                    },
                    boxShadow: {
                        'soft': '0 2px 10px rgba(0, 0, 0, 0.03)',
                        'hover': '0 8px 24px rgba(0, 0, 0, 0.06)',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-zinc-900 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-zinc-900 selection:text-white">

    <!-- Tombol Share / Salin Link di Pojok Kanan Atas -->
    <header class="w-full max-w-md mx-auto pt-6 px-5 flex justify-end">
        <button 
            id="shareBtn" 
            onclick="copyCurrentUrl()"
            aria-label="Salin tautan halaman"
            class="group flex items-center gap-2 px-3.5 py-2 rounded-full bg-white border border-gray-200 text-zinc-600 hover:text-zinc-900 hover:border-zinc-300 shadow-soft transition-all duration-200 active:scale-95 text-xs font-medium cursor-pointer"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-zinc-500 group-hover:text-zinc-900 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <span>Bagikan</span>
        </button>
    </header>

    <!-- Konten Utama -->
    <main class="w-full max-w-md mx-auto px-5 pt-4 pb-16 flex-1 flex flex-col items-center">
        
        <!-- 1. Header Logo (Tanpa Teks Judul) -->
        <div class="w-full flex flex-col items-center justify-center mb-9 mt-2">
            <div class="w-full max-w-[240px] sm:max-w-[270px] flex items-center justify-center p-2">
                <img 
                    src="https://raw.githubusercontent.com/slavadirta/slavadirta/refs/heads/main/file_00000000b39082078ccce663b9d3e18a.png" 
                    alt="slavadirta" 
                    onerror="this.onerror=null; this.src='https://placehold.co/400x140/FFFFFF/18181B?text=slavadirta';"
                    class="w-full h-auto object-contain select-none transition-transform duration-300 hover:scale-[1.02]"
                >
            </div>
        </div>

        <!-- 2. Tautan Utama -->
        <section class="w-full space-y-3.5" aria-label="Tautan Utama">
            
            <!-- Tombol Saweria -->
            <a 
                href="https://saweria.co/slavadirta" 
                target="_blank" 
                rel="noopener noreferrer"
                class="group w-full flex items-center justify-between p-4 rounded-2xl bg-white border border-gray-200 hover:border-zinc-900 shadow-soft hover:shadow-hover transition-all duration-200 hover:-translate-y-0.5 active:scale-[0.99]"
            >
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-xl bg-zinc-50 border border-gray-100 flex items-center justify-center text-zinc-800 group-hover:bg-amber-500 group-hover:text-white group-hover:border-amber-500 transition-colors duration-200">
                        <!-- Ikon Donasi / Saweria SVG -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 8h1a4 4 0 1 1 0 8h-1"></path>
                            <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path>
                            <line x1="6" y1="2" x2="6" y2="4"></line>
                            <line x1="10" y1="2" x2="10" y2="4"></line>
                            <line x1="14" y1="2" x2="14" y2="4"></line>
                        </svg>
                    </div>
                    <div class="text-left">
                        <span class="block text-[15px] font-semibold text-zinc-900">Saweria</span>
                        <span class="block text-xs text-zinc-500">Dukung kreator via Saweria</span>
                    </div>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-zinc-400 group-hover:text-zinc-900 group-hover:translate-x-0.5 transition-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 17L17 7"></path>
                    <path d="M7 7h10v10"></path>
                </svg>
            </a>

            <!-- Tombol TikTok -->
            <a 
                href="https://www.tiktok.com/@slavadirta?_r=1&_t=ZS-9BkH2H7BNW0" 
                target="_blank" 
                rel="noopener noreferrer"
                class="group w-full flex items-center justify-between p-4 rounded-2xl bg-white border border-gray-200 hover:border-zinc-900 shadow-soft hover:shadow-hover transition-all duration-200 hover:-translate-y-0.5 active:scale-[0.99]"
            >
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-xl bg-zinc-50 border border-gray-100 flex items-center justify-center text-zinc-800 group-hover:bg-zinc-900 group-hover:text-white group-hover:border-zinc-900 transition-colors duration-200">
                        <!-- Ikon TikTok SVG -->
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
                        </svg>
                    </div>
                    <div class="text-left">
                        <span class="block text-[15px] font-semibold text-zinc-900">TikTok</span>
                        <span class="block text-xs text-zinc-500">Ikuti konten terbaru di TikTok</span>
                    </div>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-zinc-400 group-hover:text-zinc-900 group-hover:translate-x-0.5 transition-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 17L17 7"></path>
                    <path d="M7 7h10v10"></path>
                </svg>
            </a>
            
            <!-- Tombol Discord -->
            <a 
                href="https://discord.gg/hknRqtSBd" 
                target="_blank" 
                rel="noopener noreferrer"
                class="group w-full flex items-center justify-between p-4 rounded-2xl bg-white border border-gray-200 hover:border-zinc-900 shadow-soft hover:shadow-hover transition-all duration-200 hover:-translate-y-0.5 active:scale-[0.99]"
            >
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-xl bg-zinc-50 border border-gray-100 flex items-center justify-center text-zinc-800 group-hover:bg-[#5865F2] group-hover:text-white group-hover:border-[#5865F2] transition-colors duration-200">
                        <!-- Ikon Discord SVG -->
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
                            <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
                        </svg>
                    </div>
                    <div class="text-left">
                        <span class="block text-[15px] font-semibold text-zinc-900">Discord</span>
                        <span class="block text-xs text-zinc-500">Gabung server komunitas</span>
                    </div>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-zinc-400 group-hover:text-zinc-900 group-hover:translate-x-0.5 transition-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 17L17 7"></path>
                    <path d="M7 7h10v10"></path>
                </svg>
            </a>

            <!-- Tombol Harga Robux (Membuka Modal Pratinjau Gambar + Opsi Gambar Penuh) -->
            <button 
                type="button"
                onclick="openPriceModal()"
                class="group w-full flex items-center justify-between p-4 rounded-2xl bg-white border border-gray-200 hover:border-zinc-900 shadow-soft hover:shadow-hover transition-all duration-200 hover:-translate-y-0.5 active:scale-[0.99] cursor-pointer"
            >
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-xl bg-zinc-50 border border-gray-100 flex items-center justify-center text-zinc-800 group-hover:bg-zinc-900 group-hover:text-white group-hover:border-zinc-900 transition-colors duration-200">
                        <!-- Ikon Tag Harga / Robux Hexagon -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                            <line x1="7" y1="7" x2="7.01" y2="7"></line>
                        </svg>
                    </div>
                    <div class="text-left">
                        <span class="block text-[15px] font-semibold text-zinc-900">Harga Robux</span>
                        <span class="block text-xs text-zinc-500">Lihat daftar harga terbaru</span>
                    </div>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-zinc-400 group-hover:text-zinc-900 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </button>

        </section>

    </main>

    <!-- Footer Minimalis -->
    <footer class="w-full py-6 text-center">
        <p class="text-xs text-zinc-400 font-medium tracking-wide">&copy; <span id="year"></span> slavadirta</p>
    </footer>

    <!-- Modal Pratinjau Gambar Harga Robux -->
    <div 
        id="priceModal" 
        class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/50 backdrop-blur-xs transition-opacity duration-200"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        onclick="closeModalOnBackdrop(event)"
    >
        <div class="bg-white border border-gray-200 rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl transform transition-all">
            <!-- Header Modal -->
            <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
                <h3 id="modalTitle" class="text-sm font-semibold text-zinc-900">Daftar Harga Robux</h3>
                <button 
                    type="button" 
                    onclick="closePriceModal()" 
                    aria-label="Tutup pratinjau"
                    class="p-2 rounded-full text-zinc-400 hover:text-zinc-900 hover:bg-zinc-100 transition-colors cursor-pointer"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Konten Gambar -->
            <div class="p-4 bg-zinc-50 max-h-[65vh] overflow-y-auto flex items-center justify-center">
                <img 
                    src="https://raw.githubusercontent.com/slavadirta/slavadirta/refs/heads/main/file_00000000846c8211a56f0c14f06c3321.png" 
                    alt="Daftar Harga Robux slavadirta" 
                    onerror="this.onerror=null; this.src='https://placehold.co/600x800/FFFFFF/18181B?text=Daftar+Harga+Robux';"
                    class="w-full h-auto rounded-2xl border border-gray-200 object-contain"
                >
            </div>

            <!-- Footer Modal dengan Tombol Buka Gambar Penuh -->
            <div class="px-5 py-4 bg-white border-t border-gray-100 flex items-center justify-between gap-3">
                <button 
                    type="button" 
                    onclick="closePriceModal()" 
                    class="px-4 py-2.5 rounded-xl border border-gray-200 text-xs font-semibold text-zinc-600 hover:text-zinc-900 hover:bg-zinc-50 transition-colors cursor-pointer"
                >
                    Tutup
                </button>
                <a 
                    href="https://raw.githubusercontent.com/slavadirta/slavadirta/refs/heads/main/file_00000000846c8211a56f0c14f06c3321.png" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    class="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-zinc-900 text-white text-xs font-semibold hover:bg-zinc-800 transition-colors"
                >
                    <span>Buka Gambar Penuh</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <!-- Notifikasi Toast Salin Link -->
    <div 
        id="toast" 
        class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-2 transition-all duration-300"
    >
        <div class="flex items-center gap-2 px-4 py-2.5 rounded-full bg-zinc-900 text-white text-xs font-medium shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Tautan berhasil disalin!</span>
        </div>
    </div>

    <script>
        // Set tahun otomatis di footer
        document.getElementById('year').textContent = new Date().getFullYear();

        // Fungsi salin link halaman
        function copyCurrentUrl() {
            const url = window.location.href;
            const tempInput = document.createElement('input');
            tempInput.value = url;
            document.body.appendChild(tempInput);
            tempInput.select();
            tempInput.setSelectionRange(0, 99999);

            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(url).then(showToast);
                }
            } finally {
                document.body.removeChild(tempInput);
            }
        }

        // Tampilkan notifikasi toast
        let toastTimeout;
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2500);
        }

        // Kontrol Modal Harga Robux
        const priceModal = document.getElementById('priceModal');

        function openPriceModal() {
            priceModal.classList.remove('hidden');
            priceModal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closePriceModal() {
            priceModal.classList.add('hidden');
            priceModal.classList.remove('flex');
            document.body.style.overflow = '';
        }

        function closeModalOnBackdrop(event) {
            if (event.target === priceModal) {
                closePriceModal();
            }
        }

        // Tutup modal menggunakan tombol Escape
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && !priceModal.classList.contains('hidden')) {
                closePriceModal();
            }
        });
    </script>
</body>
</html>
